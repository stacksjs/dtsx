name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@abb26af17a5c06a115c5adc42463ae1a44cd822a

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1282+c0f9b51d8

      - name: Install Dependencies
        run: bun install

      - name: Validate Release Tag
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}"
          package_version="$(bun -e "console.log((await Bun.file('package.json').json()).version)")"
          test "v${package_version}" = "${RELEASE_TAG}"

      - name: Build Zig CLI + Library Binaries
        working-directory: packages/zig-dtsx
        run: |
          mkdir -p ../dtsx/bin

          build_target() {
            local target="$1"   # zig target triple (e.g. x86_64-linux)
            local plat="$2"     # release-artifact platform slug (e.g. linux-x64)
            local exe_ext="$3"  # CLI extension (empty for unix, .exe for windows)
            local lib_dir="$4"  # subdirectory of zig-out/ containing the shared library (lib or bin)
            local lib_file="$5" # exact shared library filename inside lib_dir

            # Clean to avoid mixing artifacts between targets
            rm -rf zig-out

            zig build cli -Doptimize=ReleaseFast -Dtarget="$target"
            zip -j "../dtsx/bin/zig-dtsx-${plat}.zip" "zig-out/bin/zig-dtsx${exe_ext}"

            zig build lib -Doptimize=ReleaseFast -Dtarget="$target"
            # Windows DLLs land in zig-out/bin/, unix shared libs in zig-out/lib/.
            # tar.gz for the GH release (standalone download); copy into prebuilt/
            # for the npm tarball so consumers get the FFI lib without a postinstall.
            tar -czf "../dtsx/bin/zig-dtsx-lib-${plat}.tar.gz" -C "zig-out/${lib_dir}" "${lib_file}"
            mkdir -p "prebuilt/${plat}"
            cp "zig-out/${lib_dir}/${lib_file}" "prebuilt/${plat}/"
          }

          build_target x86_64-linux    linux-x64     ""     lib libzig-dtsx.so
          build_target aarch64-linux   linux-arm64   ""     lib libzig-dtsx.so
          build_target x86_64-macos    darwin-x64    ""     lib libzig-dtsx.dylib
          build_target aarch64-macos   darwin-arm64  ""     lib libzig-dtsx.dylib
          build_target x86_64-windows  windows-x64   '.exe' bin zig-dtsx.dll
          build_target x86_64-freebsd  freebsd-x64   ""     lib libzig-dtsx.so

      # Ship every package to the Pantry registry (registry.pantry.dev). This is
      # zig-dtsx's home — Home consumes the native binary via `pantry install`.
      - name: Publish to Pantry registry
        run: pantry publish
        env:
          # Token path (HTTP upload) is preferred; AWS creds enable the S3 fallback.
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
          PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      # Publish the JavaScript packages to npm for downstream package-manager
      # consumers. zig-dtsx remains Pantry-only because it ships native binaries
      # instead of a JavaScript entrypoint. Every npm package uses this workflow
      # as its trusted OIDC publisher, so a partial release must fail the job.
      - name: Publish to npm
        run: pantry publish --npm --skip zig-dtsx --access public

      - name: Create GitHub Release with Pantry
        id: pantry-release
        uses: home-lang/pantry/packages/action@abb26af17a5c06a115c5adc42463ae1a44cd822a
        with:
          install: false
          release: true
          release-tag: ${{ env.RELEASE_TAG }}
          release-changelog: auto
          release-checksums: sha256
          release-token: ${{ secrets.GITHUB_TOKEN }}
          release-files: |
            packages/dtsx/bin/zig-dtsx-linux-x64.zip
            packages/dtsx/bin/zig-dtsx-linux-arm64.zip
            packages/dtsx/bin/zig-dtsx-darwin-x64.zip
            packages/dtsx/bin/zig-dtsx-darwin-arm64.zip
            packages/dtsx/bin/zig-dtsx-windows-x64.zip
            packages/dtsx/bin/zig-dtsx-freebsd-x64.zip
            packages/dtsx/bin/zig-dtsx-lib-linux-x64.tar.gz
            packages/dtsx/bin/zig-dtsx-lib-linux-arm64.tar.gz
            packages/dtsx/bin/zig-dtsx-lib-darwin-x64.tar.gz
            packages/dtsx/bin/zig-dtsx-lib-darwin-arm64.tar.gz
            packages/dtsx/bin/zig-dtsx-lib-windows-x64.tar.gz
            packages/dtsx/bin/zig-dtsx-lib-freebsd-x64.tar.gz

      - name: Verify Pantry GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_URL: ${{ steps.pantry-release.outputs.release-url }}
        run: |
          test -n "${RELEASE_URL}"
          test -s checksums.txt

          checksum_count="$(wc -l < checksums.txt | tr -d ' ')"
          test "${checksum_count}" -eq 12
          awk 'length($1) != 64 || $2 !~ /^zig-dtsx-/ { exit 1 }' checksums.txt

          (
            cd packages/dtsx/bin
            sha256sum --check ../../../checksums.txt
          )

          while read -r checksum asset; do
            test -n "${checksum}"
            gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -Fx "${asset}"
          done < checksums.txt

          gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -Fx 'checksums.txt'
          release_body="$(gh release view "${RELEASE_TAG}" --json body --jq '.body')"
          test -n "${release_body}"
