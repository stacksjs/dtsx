name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string
      linux_libraries_only:
        description: Append corrected GNU libc libraries to v0.11.31 without republishing packages
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    if: ${{ !inputs.linux_libraries_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@ff293ff5231b67057f09d586e592f650568ad42e
        with:
          version: 0.11.180

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate Release Tag
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}"
          package_version="$(bun -e "console.log((await Bun.file('package.json').json()).version)")"
          test "v${package_version}" = "${RELEASE_TAG}"

      - name: Build JavaScript library and plugins
        run: |
          bun run build
          bun --filter './packages/*-plugin' build

      - name: Verify normally packed public SDK consumers
        id: public-sdk
        run: bun run test:public-sdk
        env:
          DTSX_SDK_EVIDENCE: ${{ runner.temp }}/public-sdk
      - name: Retain public SDK evidence
        if: always() && steps.public-sdk.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-sdk-release
          path: ${{ runner.temp }}/public-sdk
          if-no-files-found: error

      - name: Build Zig CLI + Library Binaries
        working-directory: packages/zig-dtsx
        run: |
          mkdir -p ../dtsx/bin

          build_target() {
            local target="$1"   # zig target triple (e.g. x86_64-linux)
            local plat="$2"     # release-artifact platform slug (e.g. linux-x64)
            local exe_ext="$3"  # CLI extension (empty for unix, .exe for windows)
            local lib_dir="$4"  # subdirectory of zig-out/ containing the shared library (lib or bin)
            local lib_file="$5" # exact shared library filename inside lib_dir
            local lib_target="${6:-$target}"

            # Clean to avoid mixing artifacts between targets
            rm -rf zig-out

            zig build cli -Doptimize=fast -Dtarget="$target"
            zip -j "../dtsx/bin/zig-dtsx-${plat}.zip" "zig-out/bin/zig-dtsx${exe_ext}"

            zig build lib -Doptimize=fast -Dtarget="$lib_target"
            # Windows DLLs land in zig-out/bin/, unix shared libs in zig-out/lib/.
            # tar.gz for the GH release (standalone download); copy into prebuilt/
            # for the Pantry tarball so Bun FFI consumers get the lib without a postinstall.
            tar -czf "../dtsx/bin/zig-dtsx-lib-${plat}.tar.gz" -C "zig-out/${lib_dir}" "${lib_file}"
            mkdir -p "prebuilt/${plat}"
            cp "zig-out/${lib_dir}/${lib_file}" "prebuilt/${plat}/"
          }

          # Standalone CLIs use musl; Bun FFI libraries load into a glibc process.
          build_target x86_64-linux-musl  linux-x64   ""     lib libzig-dtsx.so x86_64-linux-gnu.2.17
          build_target aarch64-linux-musl linux-arm64 ""     lib libzig-dtsx.so aarch64-linux-gnu.2.17
          build_target x86_64-macos    darwin-x64    ""     lib libzig-dtsx.dylib
          build_target aarch64-macos   darwin-arm64  ""     lib libzig-dtsx.dylib
          build_target x86_64-windows  windows-x64   '.exe' bin zig-dtsx.dll
          build_target x86_64-freebsd  freebsd-x64   ""     lib libzig-dtsx.so

      - name: Qualify packaged Linux FFI library before publication
        run: bun scripts/verify-native-library.ts --inference

      - name: Retain qualified native release artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-release-${{ env.RELEASE_TAG }}
          path: |
            packages/dtsx/bin/zig-dtsx-*.zip
            packages/dtsx/bin/zig-dtsx-lib-*.tar.gz
          if-no-files-found: error

      # Ship every package to the Pantry registry (registry.pantry.dev). This is
      # zig-dtsx's home — Home consumes the native binary via `pantry install`.
      - name: Publish to Pantry registry
        # Registry versions are immutable. A retry must verify the full existing
        # payload rather than overwrite it or fail on an already-published version.
        run: pantry publish --verify-existing
        env:
          # Token path (HTTP upload) is preferred; AWS creds enable the S3 fallback.
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
          PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      # Publish the JavaScript packages to npm for downstream package-manager
      # consumers. zig-dtsx remains Pantry-only: its authored TypeScript entry
      # loads native libraries through bun:ffi. Prefer trusted OIDC publishing,
      # with the existing npm secret available for packages without that trust.
      # A partial release must still fail the job.
      - name: Publish to npm
        run: pantry publish --npm --skip zig-dtsx --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release with Pantry
        id: pantry-release
        uses: pantry-pm/pantry/packages/action@ff293ff5231b67057f09d586e592f650568ad42e
        with:
          version: 0.11.180
          install: false
          release: true
          release-tag: ${{ env.RELEASE_TAG }}
          release-changelog: auto
          release-checksums: sha256
          release-token: ${{ secrets.GITHUB_TOKEN }}
          release-files: |
            packages/dtsx/bin/zig-dtsx-linux-x64.zip
            packages/dtsx/bin/zig-dtsx-linux-arm64.zip
            packages/dtsx/bin/zig-dtsx-darwin-x64.zip
            packages/dtsx/bin/zig-dtsx-darwin-arm64.zip
            packages/dtsx/bin/zig-dtsx-windows-x64.zip
            packages/dtsx/bin/zig-dtsx-freebsd-x64.zip
            packages/dtsx/bin/zig-dtsx-lib-linux-x64.tar.gz
            packages/dtsx/bin/zig-dtsx-lib-linux-arm64.tar.gz
            packages/dtsx/bin/zig-dtsx-lib-darwin-x64.tar.gz
            packages/dtsx/bin/zig-dtsx-lib-darwin-arm64.tar.gz
            packages/dtsx/bin/zig-dtsx-lib-windows-x64.tar.gz
            packages/dtsx/bin/zig-dtsx-lib-freebsd-x64.tar.gz

      - name: Verify Pantry GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_URL: ${{ steps.pantry-release.outputs.release-url }}
        run: |
          test -n "${RELEASE_URL}"
          test -s checksums.txt

          checksum_count="$(wc -l < checksums.txt | tr -d ' ')"
          test "${checksum_count}" -eq 12
          awk 'length($1) != 64 || $2 !~ /^zig-dtsx-/ { exit 1 }' checksums.txt

          (
            cd packages/dtsx/bin
            sha256sum --check ../../../checksums.txt
          )

          while read -r checksum asset; do
            test -n "${checksum}"
            gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -Fx "${asset}"
          done < checksums.txt

          gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -Fx 'checksums.txt'
          release_body="$(gh release view "${RELEASE_TAG}" --json body --jq '.body')"
          test -n "${release_body}"

  linux-libraries:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_libraries_only }}
    name: Repair GNU library (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: x86_64-linux-gnu.2.17
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-linux-gnu.2.17
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check out the unchanged release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: native-source
      - name: Validate repair scope
        env:
          REPAIR_TAG: ${{ inputs.tag }}
        run: test "$REPAIR_TAG" = v0.11.31
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install the original release compiler
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.0-dev.1282+c0f9b51d8
      - name: Build the released emitter with GNU libc linkage
        working-directory: native-source/packages/zig-dtsx
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          test "$(zig version)" = '0.17.0-dev.1282+c0f9b51d8'
          zig build lib -Doptimize=ReleaseFast -Dtarget="$NATIVE_TARGET" -j2
          readelf -d zig-out/lib/libzig-dtsx.so
          readelf -d zig-out/lib/libzig-dtsx.so | grep -F 'Shared library: [libc.so.6]'
          mkdir -p "prebuilt/linux-$NATIVE_ARCH"
          cp zig-out/lib/libzig-dtsx.so "prebuilt/linux-$NATIVE_ARCH/"
      - name: Install the benchmark consumer compiler outside timing
        run: |
          mkdir -p "$RUNNER_TEMP/native-consumer"
          printf '{"private":true}\n' > "$RUNNER_TEMP/native-consumer/package.json"
          bun add --cwd "$RUNNER_TEMP/native-consumer" --exact typescript@6.0.3
      - name: Qualify the actual packaged binding and library
        run: bun scripts/verify-native-library.ts native-source/packages/zig-dtsx "$RUNNER_TEMP/native-consumer/node_modules/typescript/bin/tsc"
      - name: Package an additional immutable release asset
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          source_commit="$(git -C native-source rev-parse HEAD)"
          source_epoch="$(git -C native-source show -s --format=%ct HEAD)"
          export NATIVE_SOURCE_COMMIT="$source_commit"
          tar --sort=name --mtime="@$source_epoch" --owner=0 --group=0 --numeric-owner -C native-source/packages/zig-dtsx/zig-out/lib -cf - libzig-dtsx.so | gzip -n > "artifacts/zig-dtsx-lib-linux-$NATIVE_ARCH-gnu.tar.gz"
          bun -e 'const {createHash}=await import("node:crypto"); const hash=async p=>createHash("sha256").update(await Bun.file(p).bytes()).digest("hex"); const arch=process.env.NATIVE_ARCH; const asset=`zig-dtsx-lib-linux-${arch}-gnu.tar.gz`; await Bun.write(`artifacts/metadata-${arch}.json`,JSON.stringify({asset,sourceCommit:process.env.NATIVE_SOURCE_COMMIT,target:process.env.NATIVE_TARGET,zigVersion:"0.17.0-dev.1282+c0f9b51d8",optimize:"ReleaseFast",archiveSha256:await hash(`artifacts/${asset}`),librarySha256:await hash("native-source/packages/zig-dtsx/zig-out/lib/libzig-dtsx.so"),bindingSha256:await hash("native-source/packages/zig-dtsx/src/index.ts")},null,2)+"\n")'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-linux-gnu-${{ matrix.arch }}
          path: artifacts
          if-no-files-found: error

  publish-linux-libraries:
    needs: linux-libraries
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_libraries_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v8
        with:
          pattern: native-linux-gnu-*
          merge-multiple: true
          path: artifacts
      - name: Record source, compiler, checksums and qualification provenance
        working-directory: artifacts
        env:
          REPAIR_TAG: ${{ inputs.tag }}
        run: |
          sha256sum zig-dtsx-lib-linux-*-gnu.tar.gz > checksums-linux-gnu.txt
          bun -e 'const libraries=await Promise.all(["x64","arm64"].map(arch=>Bun.file(`metadata-${arch}.json`).json())); if(libraries.some(lib=>lib.sourceCommit!==libraries[0].sourceCommit))throw new Error("Mixed release sources"); await Bun.write("linux-gnu-manifest.json",JSON.stringify({schemaVersion:1,tag:process.env.REPAIR_TAG,commit:libraries[0].sourceCommit,workflowCommit:process.env.GITHUB_SHA,workflowRun:process.env.GITHUB_RUN_ID,libraries},null,2)+"\n")'
      - name: Append verified libraries without replacing existing release assets
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPAIR_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$REPAIR_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$REPAIR_TAG" --repo "$GITHUB_REPOSITORY" zig-dtsx-lib-linux-*-gnu.tar.gz checksums-linux-gnu.txt linux-gnu-manifest.json
