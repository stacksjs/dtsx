name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  package-builds:
    name: Build workspace libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@ff293ff5231b67057f09d586e592f650568ad42e
        with:
          version: 0.11.180
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Build core library and CLI
        run: bun run build
      - name: Build every plugin library
        run: bun --filter './packages/*-plugin' build
      - name: Typecheck public SDK verifier
        run: bun run typecheck:public-sdk
      - name: Verify normally packed public SDK consumers
        id: public-sdk
        run: bun run test:public-sdk
        env:
          DTSX_SDK_EVIDENCE: ${{ runner.temp }}/public-sdk
      - name: Retain public SDK evidence
        if: always() && steps.public-sdk.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-sdk-builds
          path: ${{ runner.temp }}/public-sdk
          if-no-files-found: error

  source-paths:
    name: Source path identity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@ff293ff5231b67057f09d586e592f650568ad42e
        with:
          version: 0.11.180
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify source identity, output collisions and transactional publication
        run: bun test packages/dtsx/test/source-path-identity.test.ts packages/dtsx/test/module-graph.test.ts packages/dtsx/test/generation-publication.test.ts packages/dtsx/test/bundle-augmentation-package.test.ts
      - name: Build the native CLI and FFI library for this platform
        working-directory: packages/zig-dtsx
        run: zig build -j2
      - name: Verify actual native project traversal and installed delivery
        env:
          DTSX_NATIVE_CLI: ${{ github.workspace }}/packages/zig-dtsx/zig-out/bin/zig-dtsx${{ runner.os == 'Windows' && '.exe' || '' }}
        run: bun test packages/zig-dtsx/test/cli-project.test.ts packages/zig-dtsx/test/cli-context.test.ts packages/zig-dtsx/test/cli-augmentation.test.ts packages/dtsx/test/native-generation.test.ts packages/dtsx/test/module-augmentation-package.test.ts packages/dtsx/test/external-augmentation-package.test.ts packages/dtsx/test/private-class-package.test.ts packages/dtsx/test/destructuring-package.test.ts packages/dtsx/test/literal-bindings-package.test.ts packages/dtsx/test/call-inference-package.test.ts packages/dtsx/test/function-properties-package.test.ts packages/dtsx/test/class-expression-package.test.ts packages/dtsx/test/local-return-package.test.ts

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@ff293ff5231b67057f09d586e592f650568ad42e
        with:
          version: 0.11.180

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@ff293ff5231b67057f09d586e592f650568ad42e
        with:
          version: 0.11.180

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun --bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@ff293ff5231b67057f09d586e592f650568ad42e
        with:
          version: 0.11.180

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Zig
        working-directory: packages/zig-dtsx
        run: zig build

      - name: Unit Test
        id: unit-tests
        run: bun run test
        env:
          DTSX_TEST_TRACE: ${{ runner.temp }}/dtsx-test-phases.jsonl

      - name: Retain unit test operation phases
        if: always() && steps.unit-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-test-operation-phases
          path: ${{ runner.temp }}/dtsx-test-phases.jsonl
          if-no-files-found: error

      - name: Run Zig Unit Tests
        working-directory: packages/zig-dtsx
        run: zig build test

      - name: Run Zig Fixture Tests
        working-directory: packages/zig-dtsx
        run: bun test test/zig-dtsx.test.ts

  publish-commit:
    needs: [lint, typecheck, test, source-paths, package-builds]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@ff293ff5231b67057f09d586e592f650568ad42e
        with:
          version: 0.11.180

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Build every plugin library
        run: bun --filter './packages/*-plugin' build

      - name: Build and stage the native host library
        working-directory: packages/zig-dtsx
        run: |
          zig build -Doptimize=fast
          mkdir -p prebuilt/linux-x64
          cp zig-out/lib/libzig-dtsx.so prebuilt/linux-x64/

      - name: Verify normally packed public SDK consumers
        id: public-sdk
        run: bun run test:public-sdk
        env:
          DTSX_SDK_EVIDENCE: ${{ runner.temp }}/public-sdk
      - name: Retain public SDK evidence
        if: always() && steps.public-sdk.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-sdk-commit
          path: ${{ runner.temp }}/public-sdk
          if-no-files-found: error

      - name: Publish Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pantry publish:commit './packages/*'
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
