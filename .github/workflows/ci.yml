name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  package-builds:
    name: Build workspace libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@1ead8b67da0e4cfacced1230c72d1cfb4e72a24d
        with:
          version: 0.11.178
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Build core library and CLI
        run: bun run build
      - name: Build every plugin library
        run: bun --filter './packages/*-plugin' build

  source-paths:
    name: Source path identity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@1ead8b67da0e4cfacced1230c72d1cfb4e72a24d
        with:
          version: 0.11.178
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Verify source identity and output collision safety
        run: bun test packages/dtsx/test/source-path-identity.test.ts packages/dtsx/test/module-graph.test.ts

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@1ead8b67da0e4cfacced1230c72d1cfb4e72a24d
        with:
          version: 0.11.178

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@1ead8b67da0e4cfacced1230c72d1cfb4e72a24d
        with:
          version: 0.11.178

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun --bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@1ead8b67da0e4cfacced1230c72d1cfb4e72a24d
        with:
          version: 0.11.178

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Zig
        working-directory: packages/zig-dtsx
        run: zig build

      - name: Unit Test
        run: bun test

      - name: Run Zig Unit Tests
        working-directory: packages/zig-dtsx
        run: zig build test

      - name: Run Zig Fixture Tests
        working-directory: packages/zig-dtsx
        run: bun test test/zig-dtsx.test.ts

  publish-commit:
    needs: [lint, typecheck, test, source-paths, package-builds]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@1ead8b67da0e4cfacced1230c72d1cfb4e72a24d
        with:
          version: 0.11.178

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Build every plugin library
        run: bun --filter './packages/*-plugin' build

      - name: Build and stage the native host library
        working-directory: packages/zig-dtsx
        run: |
          zig build -Doptimize=fast
          mkdir -p prebuilt/linux-x64
          cp zig-out/lib/libzig-dtsx.so prebuilt/linux-x64/

      - name: Publish Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pantry publish:commit './packages/*'
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
