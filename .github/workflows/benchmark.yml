name: Benchmark

on:
  push:
    branches:
      - main
    paths:
      - 'packages/dtsx/src/**'
      - 'package.json'
      - 'packages/*/package.json'
      - 'bun.lock'
      - 'deps.yaml'
      - 'pantry.lock'
      - 'packages/zig-dtsx/build.zig.zon'
      - 'packages/zig-dtsx/src/**'
      - 'packages/zig-dtsx/build.zig'
      - 'packages/dtsx/benchmark.ts'
      - 'benchmark/**'
      - '.github/workflows/benchmark.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'packages/dtsx/src/**'
      - 'package.json'
      - 'packages/*/package.json'
      - 'bun.lock'
      - 'deps.yaml'
      - 'pantry.lock'
      - 'packages/zig-dtsx/build.zig.zon'
      - 'packages/zig-dtsx/src/**'
      - 'packages/zig-dtsx/build.zig'
      - 'packages/dtsx/benchmark.ts'
      - 'benchmark/**'
      - '.github/workflows/benchmark.yml'

  workflow_dispatch:
    inputs:
      full_benchmark:
        description: 'Run full benchmark (more iterations)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: benchmark-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@ff293ff5231b67057f09d586e592f650568ad42e
        with:
          version: 0.11.180

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build dtsx
        run: bun run build
        working-directory: packages/dtsx

      - name: Build zig-dtsx
        run: zig build -Doptimize=fast
        working-directory: packages/zig-dtsx

      - name: Run Internal Benchmarks
        run: |
          if [ "${{ github.event.inputs.full_benchmark }}" == "true" ]; then
            bun run benchmark.ts --json --output=benchmark-results.json
          else
            bun run benchmark.ts --ci --json --output=benchmark-results.json
          fi
        working-directory: packages/dtsx

      - name: Download Previous Benchmark
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: benchmark.yml
          branch: main
          name: benchmark-results-*
          path: base-benchmark
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Generate Summary (cross-tool comparison + regression detection)
        run: bun benchmark/ci-summary.ts --results packages/dtsx/benchmark-results.json --base base-benchmark/benchmark-results.json

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-results-${{ github.sha }}
          path: packages/dtsx/benchmark-results.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('benchmark-summary.md')) return;
            const comment = fs.readFileSync('benchmark-summary.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('## Benchmark Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
        continue-on-error: true
